name: Azra_Home_Karaoke
description: Azra Home Karaoke - Aplikasi Karaoke untuk Android & Android TV
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # WebView untuk tampilkan YouTube
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  # Deteksi platform (TV vs HP)
  device_info_plus: ^9.1.2
  # Wakelock agar layar tidak mati saat karaoke
  wakelock_plus: ^1.1.4
  # Simpan file antrian (JSON sementara, bukan database)
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Auto-generate launcher icon dari build_assets/*.png
  # (di-generate oleh tool/generate_icon_source.py dari logo.png)
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - logo.png

# ── Konfigurasi flutter_launcher_icons ──
# Dijalankan via: dart run flutter_launcher_icons
# WAJIB jalankan tool/generate_icon_source.py dulu sebelum ini,
# supaya file build_assets/*.png sudah ada (lihat .github/workflows/build.yml).
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "build_assets/icon_legacy.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "build_assets/icon_adaptive_fg.png"
  min_sdk_android: 21
